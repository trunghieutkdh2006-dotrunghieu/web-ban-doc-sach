<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Cộng đồng Review Sách | Tải Ebook</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/enhancements.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #F8FAFC 0%, #e9eef5 100%);
            min-height: 100vh;
            color: #1E293B;
        }

        .community-header {
            background: #1D3557;
            padding: 80px 20px 70px;
            text-align: center;
            color: white;
            position: relative;
        }

        .community-header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .community-header h1 i {
            margin-right: 12px;
            background: rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 50%;
        }

        .back-home {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 1000;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            text-decoration: none;
            color: #1D3557;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .community-container {
            max-width: 1100px;
            margin: -40px auto 0;
            padding: 0 24px 60px;
            position: relative;
            z-index: 10;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(18px);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        }

        .stat-card i {
            font-size: 32px;
            color: #1D3557;
            margin-bottom: 12px;
        }

        .stat-card span {
            font-size: 28px;
            font-weight: 800;
            color: #1D3557;
            display: block;
        }

        .toolbar {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(18px);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.9);
            font-family: inherit;
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #94A3B8;
        }

        .filter-bar {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-bar select {
            flex: 1;
            padding: 14px 18px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }

        .refresh-btn {
            width: 100%;
            padding: 14px;
            background: #1D3557;
            color: white;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .review-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(18px);
            border-radius: 28px;
            padding: 28px;
            margin-bottom: 24px;
            transition: all 0.3s;
        }

        .review-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.12);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .post-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1D3557, #457B9D);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: white;
        }

        .post-username {
            font-size: 17px;
            font-weight: 700;
            color: #1E293B;
        }

        .post-date {
            font-size: 12px;
            color: #94A3B8;
            margin-top: 4px;
        }

        .book-preview {
            display: flex;
            gap: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .book-preview img {
            width: 100px;
            height: 140px;
            object-fit: cover;
            border-radius: 16px;
        }

        .book-title {
            font-size: 20px;
            font-weight: 800;
            color: #1D3557;
        }

        .post-rating {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stars i {
            color: #fbbf24;
        }

        .rating-badge {
            background: rgba(251, 191, 36, 0.15);
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 700;
            color: #b45309;
        }

        .post-content {
            background: rgba(255, 255, 255, 0.5);
            padding: 20px;
            border-radius: 20px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .social-actions {
            display: flex;
            gap: 24px;
            padding-top: 8px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        .like-btn,
        .comment-toggle {
            background: none;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 40px;
            color: #475569;
        }

        .like-btn.liked {
            color: #E63946;
        }

        .comments-section {
            margin-top: 16px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 16px;
            display: none;
        }

        .comments-section.open {
            display: block;
        }

        .comment-input-area {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .comment-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 40px;
            background: white;
        }

        .comment-input-area button {
            background: #1D3557;
            border: none;
            color: white;
            padding: 0 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        .loading,
        .empty {
            background: rgba(255, 255, 255, 0.75);
            border-radius: 28px;
            padding: 60px 30px;
            text-align: center;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 40px;
        }

        .pagination button {
            min-width: 48px;
            height: 48px;
            border: none;
            border-radius: 16px;
            background: white;
            font-weight: 600;
            cursor: pointer;
        }

        .community-footer {
            background: linear-gradient(135deg, #1D3557, #0f1a2e);
            padding: 40px 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 768px) {
            .stats-bar {
                grid-template-columns: 1fr;
            }

            .book-preview {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i>
        Trang chủ
    </a>

    <div class="community-header">
        <h1><i class="fas fa-users"></i> Cộng đồng Review Sách</h1>
        <p>✨ Khám phá cảm nhận và chia sẻ từ độc giả ✨</p>
    </div>

    <div class="community-container">

        <div class="stats-bar">
            <div class="stat-card">
                <i class="fas fa-book-open"></i>
                <div><span id="totalReviews">0</span><small> bài review</small></div>
            </div>
            <div class="stat-card">
                <i class="fas fa-star"></i>
                <div><span id="avgRating">0</span><small>/5.0 sao</small></div>
            </div>
            <div class="stat-card">
                <i class="fas fa-calendar-day"></i>
                <div><span id="todayReviews">0</span><small> hôm nay</small></div>
            </div>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Tìm kiếm review theo tên sách hoặc nội dung..." />
            </div>
            <div class="filter-bar">
                <select id="sortSelect">
                    <option value="newest">✨ Mới nhất</option>
                    <option value="oldest">📅 Cũ nhất</option>
                    <option value="rating-high">⭐ Đánh giá cao nhất</option>
                </select>
                <select id="ratingFilter">
                    <option value="all">🎯 Tất cả sao</option>
                    <option value="5">⭐⭐⭐⭐⭐ 5 sao</option>
                    <option value="4">⭐⭐⭐⭐ 4 sao trở lên</option>
                </select>
            </div>
            <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Làm mới danh sách</button>
        </div>

        <div id="reviewsContainer"></div>
        <div class="pagination" id="pagination"></div>
    </div>

    <footer class="community-footer"><i class="fas fa-heart"></i> Góc chia sẻ review sách - Thả tim & bình luận</footer>

    <script src="js/reviews-page.js"></script>
</body>

</html>
